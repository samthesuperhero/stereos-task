# Accept plain HTTP only to send clients to the canonical HTTPS endpoint.
# Keeping the hostname explicit prevents unrelated Host values from selecting this site.
server {
    listen 80;
    server_name stereos.filestreamcloud.org;

    # Preserve the original host and path while using a permanent, cacheable redirect.
    return 301 https://$host$request_uri;
}

# Serve the application over TLS; the backend remains private on loopback.
server {
    listen 443 ssl;
    server_name stereos.filestreamcloud.org;

    # fullchain.pem includes intermediate certificates required by clients.
    # The private key stays on the host and is never copied into the repository.
    ssl_certificate /etc/letsencrypt/live/stereos.filestreamcloud.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stereos.filestreamcloud.org/privkey.pem;

    # HSTS tells browsers to use HTTPS for one year; enable only after HTTPS is verified.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Prevent browsers from interpreting responses as a different content type.
    add_header X-Content-Type-Options "nosniff" always;
    # Block framing by other pages to reduce clickjacking risk.
    add_header X-Frame-Options "DENY" always;
    # Avoid sending full source URLs to other origins through the Referer header.
    add_header Referrer-Policy "same-origin" always;

    # nginx serves the framework-free frontend directly from its installed directory.
    root /var/www/stereos-task;
    index index.html;

    location /api/ {
        # Forward API requests to the asyncio service without exposing its port publicly.
        proxy_pass http://127.0.0.1:61070;
        # HTTP/1.1 provides the backend with a conventional proxy request connection.
        proxy_http_version 1.1;

        # Preserve the public host for backend URL and request handling.
        proxy_set_header Host $host;
        # Provide the immediate client address separately from the forwarding chain.
        proxy_set_header X-Real-IP $remote_addr;
        # Append the client address to the standard proxy forwarding chain.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell the backend whether the public request used HTTP or HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow slow processing or responses for up to 60 seconds before timing out.
        proxy_read_timeout 60s;
        # Match the backend's 8 MiB request limit so oversized uploads fail at the edge.
        client_max_body_size 8m;
    }

    location / {
        # Serve an existing file or directory index; do not invent application routes.
        try_files $uri $uri/ =404;

        # Always revalidate: asset filenames have no cache-busting hashes, so browsers
        # must check ETag/Last-Modified on every request. An unchanged file still permits
        # a cheap 304 response instead of a full download.
        add_header Cache-Control "no-cache" always;

        # A location-level add_header directive stops inheritance from the server block.
        # Re-assert every security header here and keep these values in sync with it.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
